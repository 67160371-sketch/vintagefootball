{% extends "base.html" %}

{% block title %}สมัครสมาชิก | Vintage Kits FC{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12">

    <div class="glass-panel-dark p-8 rounded-3xl border border-emerald-800/40 shadow-2xl relative overflow-hidden">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="w-14 h-14 rounded-2xl bg-emerald-950/80 border border-emerald-500/50 flex items-center justify-center mx-auto mb-3 shadow-lg">
                <i class="fa-solid fa-user-plus text-2xl text-retro-gold"></i>
            </div>
            <h1 class="text-2xl font-black text-white font-sports tracking-wide">สมัครสมาชิก</h1>
            <p class="text-xs text-slate-400 mt-1">สร้างบัญชีเพื่อสะสมเสื้อฟุตบอลและติดตามสถานะจัดส่ง</p>
        </div>

        <!-- Form -->
        <form method="POST" action="{{ url_for('register') }}" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">
                    ชื่อ-นามสกุล <span class="text-red-400">*</span>
                </label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="text" name="name" required placeholder="เช่น ธนาวุฒิ สุขสวัสดิ์"
                           class="w-full pl-9 pr-4 py-2.5 bg-pitch-950 border border-emerald-700/50 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">
                    อีเมล <span class="text-red-400">*</span>
                </label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="email" name="email" required placeholder="name@example.com"
                           class="w-full pl-9 pr-4 py-2.5 bg-pitch-950 border border-emerald-700/50 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">
                    รหัสผ่าน <span class="text-red-400">*</span>
                </label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="password" name="password" required placeholder="อย่างน้อย 6 ตัวอักษร"
                           class="w-full pl-9 pr-4 py-2.5 bg-pitch-950 border border-emerald-700/50 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">
                    ที่อยู่สำหรับจัดส่งสินค้าเริ่มต้น
                </label>
                <textarea name="address" rows="2" placeholder="บ้านเลขที่, ถนน, แขวง/ตำบล, เขต/อำเภอ, จังหวัด, รหัสไปรษณีย์"
                          class="w-full px-3.5 py-2 bg-pitch-950 border border-emerald-700/50 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500"></textarea>
            </div>

            <button type="submit" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-lg shadow-emerald-950/60 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-plus"></i>
                <span>ยืนยันการสมัครสมาชิก</span>
            </button>
        </form>

        <!-- Login Link -->
        <div class="text-center mt-6 pt-4 border-t border-emerald-800/40 text-xs text-slate-400">
            มีบัญชีสมาชิกอยู่แล้ว? 
            <a href="{{ url_for('login') }}" class="text-emerald-400 font-bold hover:underline ml-1">เข้าสู่ระบบ</a>
        </div>

    </div>

</div>
{% endblock %}
