{% extends "base.html" %}

{% block title %}เข้าสู่ระบบ | Vintage Kits FC{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12">

    <div class="glass-panel-dark p-8 rounded-3xl border border-emerald-800/40 shadow-2xl relative overflow-hidden">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="w-14 h-14 rounded-2xl bg-emerald-950/80 border border-emerald-500/50 flex items-center justify-center mx-auto mb-3 shadow-lg">
                <i class="fa-solid fa-arrow-right-to-bracket text-2xl text-retro-gold"></i>
            </div>
            <h1 class="text-2xl font-black text-white font-sports tracking-wide">เข้าสู่ระบบ</h1>
            <p class="text-xs text-slate-400 mt-1">ยินดีต้อนรับสู่ร้านเสื้อฟุตบอลวินเทจแท้</p>
        </div>

        <!-- 1-Click Quick Demo Accounts Box -->
        <div class="mb-6 p-3.5 rounded-2xl bg-pitch-950/90 border border-retro-gold/40 space-y-2">
            <div class="flex items-center gap-1.5 text-xs font-bold text-retro-gold">
                <i class="fa-solid fa-bolt"></i>
                <span>บัญชีทดสอบสำหรับนำเสนออาจารย์ (Demo):</span>
            </div>
            <div class="grid grid-cols-2 gap-2 text-xs">
                <button type="button" onclick="fillCustomer()" class="p-2 rounded-xl bg-emerald-900/40 hover:bg-emerald-900/70 border border-emerald-700/50 text-emerald-300 text-left transition">
                    <strong class="block text-white text-[11px]">👤 ลูกค้า (Customer)</strong>
                    <span class="text-[10px] text-slate-400 block">customer@gmail.com</span>
                </button>
                <button type="button" onclick="fillAdmin()" class="p-2 rounded-xl bg-amber-900/40 hover:bg-amber-900/70 border border-amber-700/50 text-amber-300 text-left transition">
                    <strong class="block text-white text-[11px]">👑 แอดมิน (Admin)</strong>
                    <span class="text-[10px] text-slate-400 block">admin@vintagefootball.com</span>
                </button>
            </div>
        </div>

        <!-- Form -->
        <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">อีเมลผู้ใช้งาน</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="email" name="email" id="email" required placeholder="name@example.com"
                           class="w-full pl-9 pr-4 py-2.5 bg-pitch-950 border border-emerald-700/50 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">รหัสผ่าน</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="password" name="password" id="password" required placeholder="••••••••"
                           class="w-full pl-9 pr-4 py-2.5 bg-pitch-950 border border-emerald-700/50 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <button type="submit" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-lg shadow-emerald-950/60 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
                <span>เข้าสู่ระบบ</span>
            </button>
        </form>

        <!-- Register Link -->
        <div class="text-center mt-6 pt-4 border-t border-emerald-800/40 text-xs text-slate-400">
            ยังไม่มีบัญชีสมาชิก? 
            <a href="{{ url_for('register') }}" class="text-emerald-400 font-bold hover:underline ml-1">สมัครสมาชิกที่นี่</a>
        </div>

    </div>

</div>

<script>
function fillCustomer() {
    document.getElementById('email').value = 'customer@gmail.com';
    document.getElementById('password').value = '123456';
}
function fillAdmin() {
    document.getElementById('email').value = 'admin@vintagefootball.com';
    document.getElementById('password').value = 'admin123';
}
</script>
{% endblock %}
